<style>
  :root{
    --song:#A8262F; --song-soft:#F6DEDC;
    --bg:#EFF0EE; --surface:#FBFBFA; --surface-2:#F5F5F2;
    --ink:#1E2124; --ink-2:#5A5F66; --ink-3:#8A8F96;
    --line:#D9DAD5; --line-soft:#E5E6E1;
    --accent:#A8262F; --accent-soft:#F6DEDC;
    --ok:#2E7D4F;
    --st-y:#2E7D4F; --st-y-bg:#E1F0E7;
    --st-l:#B26A0A; --st-l-bg:#FAE9CE;
    --st-n:#C0392B; --st-n-bg:#F9E0DC;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151619; --surface:#1E2023; --surface-2:#26282C;
      --ink:#E9E8E4; --ink-2:#A2A7AD; --ink-3:#71767D;
      --line:#34373C; --line-soft:#2B2E32;
      --accent:#E3B341; --accent-soft:#3A2E14;
      --ok:#57C98A;
      --st-y:#57C98A; --st-y-bg:#1E3A2B;
      --st-l:#F0A83C; --st-l-bg:#3A2E1A;
      --st-n:#FF8A7A; --st-n-bg:#3D2320;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151619; --surface:#1E2023; --surface-2:#26282C;
    --ink:#E9E8E4; --ink-2:#A2A7AD; --ink-3:#71767D;
    --line:#34373C; --line-soft:#2B2E32;
    --accent:#E3B341; --accent-soft:#3A2E14;
    --ok:#57C98A;
    --st-y:#57C98A; --st-y-bg:#1E3A2B;
    --st-l:#F0A83C; --st-l-bg:#3A2E1A;
    --st-n:#FF8A7A; --st-n-bg:#3D2320;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:15px; line-height:1.6;
  }
  button{font:inherit; cursor:pointer}
  input, textarea{font:inherit; color:inherit; font-size:16px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .wrap{max-width:1080px; margin:0 auto; padding:0 16px 56px}

  /* ── 상단바: 탭 + 저장 상태 ─────────── */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
    margin:0 -16px 18px; padding:6px 16px 0;
  }
  nav.tabs{display:flex; gap:2px; flex:1; min-width:0}
  nav.tabs button{
    appearance:none; background:none; border:none; color:var(--ink-2);
    padding:12px 14px 13px; font-size:15px; font-weight:500;
    border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap;
  }
  nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--song); font-weight:700}
  .save-chip{
    font-size:12px; color:var(--ink-2); flex-shrink:0; margin-bottom:2px;
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px;
    background:var(--surface); cursor:pointer;
  }
  .save-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex-shrink:0}
  .save-chip[data-s="saved"] .dot{background:var(--ok)}
  .save-chip[data-s="saving"] .dot{background:var(--accent)}
  .save-chip[data-s="error"] .dot{background:#FF5A48}

  /* 관리자 패널 */
  .admin-panel{
    display:none; margin-bottom:16px; padding:14px 16px; border-radius:8px;
    background:var(--surface); border:1px solid var(--line);
  }
  .admin-panel.on{display:block}
  .admin-panel .row{display:flex; gap:8px; flex-wrap:wrap}
  .admin-panel input{
    flex:1; min-width:200px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface-2); padding:8px 12px;
  }
  .admin-panel .hint{font-size:12.5px; color:var(--ink-3); margin:8px 0 0}
  .admin-panel .hint a{color:var(--accent)}
  .admin-panel .msg{color:#C0392B; font-weight:500; white-space:pre-wrap}
  .admin-panel .msg[hidden]{display:none}
  :root[data-theme="dark"] .admin-panel .msg{color:#FF8A7A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .admin-panel .msg{color:#FF8A7A} }
  .admin-panel .row + .row{margin-top:8px}
  .admin-panel .srv{margin-top:10px; font-size:12.5px; color:var(--ink-3)}
  .admin-panel .srv summary{cursor:pointer}
  .admin-panel .srv .row{margin-top:8px}

  .view{display:none}
  .view.on{display:block}

  /* 뷰어(보기 전용) 모드 */
  body:not(.admin) .admin-only{display:none !important}
  body:not(.admin) .cue-meta input[type=text],
  body:not(.admin) .cue-meta textarea{
    border-color:transparent; background:none; resize:none; pointer-events:none;
  }

  /* ── 동선표 ─────────────────────── */
  .blocking{display:grid; grid-template-columns:240px 1fr; gap:20px}

  .cuelist{display:flex; flex-direction:column; gap:14px; min-width:0}
  .cuegroup .song-h{
    font-size:12px; letter-spacing:.1em; color:var(--ink-3); font-weight:700;
    margin:0 0 6px 2px; text-transform:uppercase;
  }
  .cue{
    display:flex; align-items:center; gap:10px; width:100%;
    text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:6px; padding:9px 11px; color:var(--ink); margin-bottom:6px;
  }
  .cue .no{
    font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3);
    min-width:44px; flex-shrink:0;
  }
  .cue.on{border-color:var(--song); background:var(--song-soft)}
  .cue.on .no{color:var(--song); font-weight:500}
  .cue.add{border-style:dashed; color:var(--ink-3); justify-content:center; background:none}
  .cue.add:hover{color:var(--ink); border-color:var(--ink-3)}
  .blocking.empty-mode{grid-template-columns:1fr}
  .blocking.empty-mode .cuelist{display:none}
  .stage-panel.empty-mode > :not(#blocking-empty){display:none}
  .stage-panel #blocking-empty{display:none}
  .stage-panel.empty-mode #blocking-empty{display:flex}
  .empty{
    border:1px dashed var(--line); border-radius:8px; padding:40px 20px; text-align:center;
    color:var(--ink-3); font-size:13.5px; flex-direction:column; gap:10px; align-items:center;
  }
  .empty .empty-t{color:var(--ink-2); font-size:15px; font-weight:500}
  .empty .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}

  /* 무대: 라이트/다크 공통 — 언제나 블랙 스테이지 */
  .stage-panel{min-width:0}
  .stage{
    position:relative; aspect-ratio:16/9; border-radius:8px; overflow:hidden;
    background:#1A1B1E;
    border:1px solid #000; box-shadow:inset 0 0 60px rgba(0,0,0,.55);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .stage .tape-center{
    position:absolute; left:50%; top:0; bottom:14%; width:0;
    border-left:2px dashed rgba(255,255,255,.22);
  }
  .stage .spike{
    position:absolute; width:14px; height:14px; transform:translate(-50%,-50%);
    opacity:.5; pointer-events:none;
  }
  .stage .spike::before,.stage .spike::after{
    content:""; position:absolute; left:50%; top:50%; width:14px; height:3px;
    background:rgba(255,201,60,.65); transform:translate(-50%,-50%) rotate(45deg);
  }
  .stage .spike::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .stage .edge{
    position:absolute; font-family:"IBM Plex Mono", monospace; font-size:11px;
    letter-spacing:.18em; color:rgba(255,255,255,.45); pointer-events:none;
  }
  .edge.back{top:8px; left:50%; transform:translateX(-50%)}
  .edge.sl{left:8px; top:44%; transform:translateY(-50%); writing-mode:vertical-rl}
  .edge.sr{right:8px; top:44%; transform:translateY(-50%); writing-mode:vertical-rl}
  .stage .apron{
    position:absolute; left:0; right:0; bottom:0; height:14%;
    background:repeating-linear-gradient(45deg, rgba(255,201,60,.14) 0 10px, rgba(0,0,0,0) 10px 20px);
    border-top:2px solid rgba(255,201,60,.5);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.24em;
    color:rgba(255,255,255,.55); pointer-events:none;
  }

  .mchip{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:grab; touch-action:none;
  }
  body:not(.admin) .mchip,
  body:not(.admin) .pchip{cursor:default}
  .mchip.drag{cursor:grabbing; z-index:6}
  .mchip .dot{
    width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,.55); border:3px solid var(--c);
    color:#fff; font-weight:700; font-size:12px; letter-spacing:-.03em;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .mchip .tag{
    font-size:10.5px; color:#fff; background:rgba(0,0,0,.6);
    padding:1px 7px; border-radius:999px; white-space:nowrap;
  }

  /* 소품 (스탠딩 마이크 · 의자) */
  .pchip{
    position:absolute; transform:translate(-50%,-50%);
    width:34px; height:40px; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  .pchip.drag{cursor:grabbing; z-index:6}
  .pchip svg{width:100%; height:100%; display:block; color:#D5D7DA; pointer-events:none}
  .pchip.sel svg{color:#FFC93C; filter:drop-shadow(0 0 5px rgba(255,201,60,.6))}
  .pchip .px{
    display:none; position:absolute; top:-10px; right:-12px;
    width:24px; height:24px; border-radius:50%;
    background:#FF5A48; color:#fff; border:2px solid #1A1B1E;
    font-size:12px; line-height:1; padding:0;
    align-items:center; justify-content:center;
  }
  .pchip.sel .px{display:flex}

  .mchip.anim,.pchip.anim{transition:left .5s cubic-bezier(.25,.8,.3,1), top .5s cubic-bezier(.25,.8,.3,1)}
  @media (prefers-reduced-motion: reduce){ .mchip.anim,.pchip.anim{transition:none} }

  /* 대형 이동 (이전/다음) */
  .cue-nav{display:flex; align-items:center; gap:8px; margin-top:10px}
  .cue-nav .cue-now{
    flex:1; text-align:center; font-family:"IBM Plex Mono", monospace;
    font-size:12.5px; color:var(--ink-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cue-nav .btn{min-width:52px}

  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:12.5px; color:var(--ink-2)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{width:11px; height:11px; border-radius:50%; background:var(--c); display:inline-block}

  .cue-meta{
    margin-top:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:14px 16px; display:grid; gap:10px;
  }
  .cue-meta label{font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.08em}
  .cue-meta input[type=text]{
    width:100%; border:none; border-bottom:1px solid var(--line); background:none;
    padding:4px 2px 6px; font-weight:700;
  }
  .cue-meta textarea{
    width:100%; border:1px solid var(--line-soft); background:var(--surface-2);
    border-radius:6px; padding:9px 11px; resize:vertical; min-height:56px; line-height:1.55;
  }
  .cue-actions{display:flex; gap:8px; flex-wrap:wrap}
  .btn{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:8px 14px; font-size:13.5px; color:var(--ink); min-height:38px;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.warn{color:#C0392B}
  :root[data-theme="dark"] .btn.warn{color:#FF8A7A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.warn{color:#FF8A7A} }

  /* ── 일정표 ─────────────────────── */
  .me-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .me-set{
    flex:1 1 100%; display:grid; gap:8px; padding:12px 14px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
  }
  .me-set[hidden]{display:none}
  .me-set label{font-size:14px; font-weight:700; color:var(--ink)}
  .me-set label small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-2); margin-top:2px}
  .me-set select{
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    padding:9px 10px; min-height:44px; font-size:15px; color:var(--ink); width:100%;
  }
  .me-now{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2)}
  .me-now[hidden]{display:none}
  .me-now::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c, var(--accent))}
  .me-now b{color:var(--ink)}
  .me-change{
    appearance:none; background:none; border:none; padding:2px 4px; font-size:12.5px;
    color:var(--accent); text-decoration:underline; text-underline-offset:2px;
  }
  .me-bar .spacer{flex:1}
  #btn-att-refresh .ic{margin-right:4px}
  .sync-chip{
    font-size:12px; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:var(--surface);
  }
  .sync-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex-shrink:0}
  .sync-chip[data-s="ok"] .dot{background:var(--ok)}
  .sync-chip[data-s="busy"] .dot{background:var(--accent)}
  .sync-chip[data-s="err"] .dot{background:#FF5A48}

  .sched-list{display:flex; flex-direction:column; gap:8px; max-width:720px}
  .sched-h{font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-3); margin:10px 0 0 2px}
  .sched-h:first-child{margin-top:0}
  .sched-empty{color:var(--ink-3); font-size:13.5px; padding:20px 0; text-align:center}

  /* 바 (앞면/뒷면 뒤집기) */
  .sbar{perspective:1400px}
  .sbar-in{
    display:grid; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.35,.1,.25,1);
  }
  .sbar.flip .sbar-in{transform:rotateX(180deg)}
  @media (prefers-reduced-motion: reduce){ .sbar-in{transition:none} }
  .sbar-face{
    grid-area:1/1; display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 10px 10px 14px; min-height:68px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .sbar-face.back{transform:rotateX(180deg); background:var(--surface-2); border-color:var(--accent)}
  .sbar.today .front{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .sbar.past .front{opacity:.72}
  .sbar.off .front{opacity:.6; background:var(--surface-2)}

  .sb-date{width:64px; flex-shrink:0; line-height:1.1}
  .sb-date b{display:block; font-family:"Do Hyeon", sans-serif; font-weight:400; font-size:23px; letter-spacing:.01em}
  .sb-date span{
    display:flex; align-items:center; gap:5px; margin-top:2px;
    font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--ink-3);
  }
  .sb-date em{
    font-style:normal; color:var(--accent); font-weight:500; white-space:nowrap;
  }
  .sbar.off .sb-date b{text-decoration:line-through; color:var(--ink-3)}

  .sb-info{flex:1; min-width:0}
  .sb-con{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sb-con.empty{color:var(--ink-3); font-weight:400}
  .sb-con-in{
    width:100%; border:none; border-bottom:1px dashed var(--line); background:none;
    padding:2px 0 3px; font-size:14.5px; font-weight:500; border-radius:0;
  }
  .sb-con-in:focus{border-bottom-color:var(--accent); outline:none}
  .sb-meta{
    font-size:12px; color:var(--ink-3); margin-top:3px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .sb-meta .cnt{
    appearance:none; background:none; border:none; padding:0; font:inherit; color:inherit;
    display:inline-flex; gap:7px; align-items:center; cursor:pointer;
  }
  .sb-meta .cnt i{font-style:normal; font-weight:700}
  .sb-meta .cnt i.y{color:var(--st-y)} .sb-meta .cnt i.l{color:var(--st-l)} .sb-meta .cnt i.n{color:var(--st-n)}
  .sb-meta .cnt::after{content:"▾"; font-size:10px; color:var(--ink-3)}
  .sbar.open .sb-meta .cnt::after{content:"▴"}

  .sb-check{
    flex-shrink:0; min-width:66px; min-height:46px; padding:0 12px;
    border-radius:9px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .sb-check.none{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .sb-check[data-s="y"]{background:var(--st-y-bg); color:var(--st-y); border-color:var(--st-y)}
  .sb-check[data-s="l"]{background:var(--st-l-bg); color:var(--st-l); border-color:var(--st-l)}
  .sb-check[data-s="n"]{background:var(--st-n-bg); color:var(--st-n); border-color:var(--st-n)}
  .sb-check:disabled{opacity:.5}

  .sb-pick{flex:1; display:flex; gap:6px; min-width:0}
  .sb-pick button{
    flex:1; min-height:46px; border-radius:9px; font-weight:700; font-size:14.5px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  }
  .sb-pick button[data-p="y"].on{background:var(--st-y-bg); color:var(--st-y); border-color:var(--st-y)}
  .sb-pick button[data-p="l"].on{background:var(--st-l-bg); color:var(--st-l); border-color:var(--st-l)}
  .sb-pick button[data-p="n"].on{background:var(--st-n-bg); color:var(--st-n); border-color:var(--st-n)}
  .sb-need{flex:1; font-size:13.5px; color:var(--ink-2); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .sb-close{
    flex-shrink:0; width:44px; height:46px; border-radius:9px; font-size:16px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  }

  .sb-roster{
    display:grid; gap:3px; padding:8px 14px 2px 78px;
    font-size:12.5px; color:var(--ink-2); line-height:1.5; word-break:keep-all;
  }
  .sb-roster[hidden]{display:none}
  .sb-roster b{font-weight:700; margin-right:5px}
  .sb-roster .y b{color:var(--st-y)} .sb-roster .l b{color:var(--st-l)}
  .sb-roster .n b{color:var(--st-n)} .sb-roster .u b{color:var(--ink-3)}
  .sb-admin{display:flex; gap:6px; padding:6px 0 0 78px}
  .sb-admin .btn{min-height:32px; padding:4px 10px; font-size:12.5px}
  .past-toggle{margin-top:10px; align-self:flex-start}
  .sched-foot{display:flex; gap:8px; margin-top:12px}

  /* ── 가사집 ─────────────────────── */
  .lyrics-col{max-width:660px}
  .songcard{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:16px;
  }
  .songcard .head{display:flex; align-items:baseline; gap:12px; margin-bottom:8px; flex-wrap:wrap}
  .songcard .head h2{
    font-family:"Do Hyeon", sans-serif; font-weight:400; font-size:22px; margin:0; flex:1; min-width:140px;
  }
  .songcard .head .glabel{flex:1; font-size:12px; letter-spacing:.1em; color:var(--ink-3); font-weight:700; text-transform:uppercase}
  .lyric-body p{margin:0 0 4px; white-space:pre-wrap}
  .lyric-body .sec{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; letter-spacing:.12em;
    color:var(--song); margin:16px 0 6px; font-weight:500;
  }
  .lyric-body .sec:first-child{margin-top:4px}
  .lyric-body .lyric-empty{color:var(--ink-3); font-size:13.5px; padding:18px 0}
  .lyric-body .echo{color:var(--ink-3); font-size:13px}
  /* 편집 모드: 카드가 화면 폭 전체를 쓰고, 편집기 + 미리보기 2단 */
  .lyrics-col.editing{max-width:none}
  .songcard.editing{padding-bottom:14px; scroll-margin-top:70px}
  .lyric-edit{--edit-h:clamp(360px, calc(100vh - 250px), 900px)}
  .lyric-edit .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    position:sticky; top:58px; z-index:5;
    background:var(--surface); padding:8px 0 10px; margin-top:-4px;
    border-bottom:1px solid var(--line-soft);
  }
  .lyric-edit .toolbar .sp{flex:1}
  .lyric-edit .toolbar .kbd{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-3);
    border:1px solid var(--line); border-radius:4px; padding:1px 5px; background:var(--surface-2);
  }
  .lyric-edit .toolbar .hint{font-size:12.5px; color:var(--ink-3); display:inline-flex; gap:6px; align-items:center}
  .lyric-edit .toolbar .dirty{font-size:12.5px; color:var(--accent); font-weight:700; display:none}
  .lyric-edit.dirty .toolbar .dirty{display:inline}
  .lyric-edit .btn.ins{padding:6px 10px; min-height:32px; font-size:12.5px; font-family:"IBM Plex Mono", monospace}
  .lyric-edit .panes{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:12px;
  }
  .lyric-edit textarea{
    width:100%; height:var(--edit-h); min-height:240px; display:block;
    border:1px solid var(--line); border-radius:6px;
    background:var(--surface-2); padding:14px 16px; line-height:1.75; resize:vertical;
    tab-size:2; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .lyric-edit textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .lyric-edit .preview{
    height:var(--edit-h); min-height:240px; overflow:auto;
    border:1px solid var(--line-soft); border-radius:6px; padding:14px 18px;
    background:var(--surface);
  }
  .lyric-edit .preview .plabel{
    font-size:11px; letter-spacing:.1em; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; margin:0 0 8px;
  }
  .lyric-edit .row{display:flex; gap:8px; margin-top:10px}
  @media (max-width:900px){
    .lyric-edit .panes{grid-template-columns:1fr}
    .lyric-edit .preview{display:none}
    .lyric-edit{--edit-h:60vh}
    .lyric-edit .toolbar .hint{display:none}
  }
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}

  /* ── 악보 (PDF 뷰어) ─────────────── */
  .doc-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
  .doc-chips{display:flex; gap:6px; flex-wrap:wrap; flex:1}
  .doc-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-size:13.5px; color:var(--ink);
  }
  .doc-chip.on{border-color:var(--song); background:var(--song-soft); font-weight:700}
  .doc-chips:empty{display:none}
  .doc-actions{display:flex; gap:6px}
  .doc-actions a{text-decoration:none; display:inline-flex; align-items:center}
  .pdf-pages{display:flex; flex-direction:column; gap:12px; align-items:center}
  .pdf-pages canvas{
    width:100%; max-width:860px; height:auto; display:block;
    background:#fff; border-radius:4px; box-shadow:0 1px 8px rgba(0,0,0,.14);
  }
  .pdf-msg{color:var(--ink-3); font-size:13.5px; padding:24px 0; text-align:center}
  .pdf-msg a{color:var(--accent)}

  /* ── 자료실: 곡별 묶음 ─────────────── */
  .files-list{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
  .fgroup{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 16px; min-width:0}
  .fgroup.full{grid-column:1 / -1}
  .fgroup h3{
    margin:0 0 8px; font-size:12px; letter-spacing:.1em; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  .fgroup h3 .cnt{font-family:"IBM Plex Mono", monospace; font-weight:400}
  .filerow{
    display:flex; align-items:center; gap:12px; padding:9px 0;
    border-top:1px solid var(--line-soft);
  }
  .fgroup h3 + .filerow, .chips + .filerow{border-top:none}
  .filerow .f-ic{
    width:36px; height:36px; border-radius:8px; flex-shrink:0;

    background:var(--surface-2); border:1px solid var(--line); border-radius:999px;

  /* 일정 진행표 */
  .sb-plan{padding:8px 14px 10px; font-size:13px; color:var(--ink-2); border-top:1px solid var(--line-soft)}

  .cue-tools .btn[aria-pressed="true"]{background:var(--song-soft); border-color:var(--song); font-weight:700}
  .cue-count{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3)}

  .ct-row{display:grid; grid-template-columns:130px minmax(0,1.25fr) minmax(0,1.5fr) minmax(0,.7fr); gap:12px; padding:9px 14px; border-top:1px solid var(--line-soft); font-size:13.5px; line-height:1.55; overflow-wrap:anywhere}
  .ct-row:first-child{border-top:none}

  .ct-part b{display:block; font-weight:700}
  .ct-type,.ct-micb{display:inline-block; font-size:11px; color:var(--ink-3); margin-right:6px}
  .ct-micb{color:var(--song)}
  .ct-memo{color:var(--ink-2)}
  .ct-set{color:var(--ink-3); font-size:12.5px}
  .ct-sec{padding:6px 14px; background:var(--song-soft); border-top:1px solid var(--line); font-size:12px; font-weight:700; letter-spacing:.04em}
  .cue-mic{white-space:pre-line}
  .cuetable mark{background:var(--song-soft); color:inherit; padding:0 1px; border-radius:2px}
  @media (max-width:760px){

    .ct-memo{font-size:12.5px; border-left:2px solid var(--line); padding-left:8px}
  }
</style>
</head>

<div class="wrap">

<script>
(function(){
  "use strict";
  // 서버(Apps Script 웹 앱) 주소 — apps-script/README.md 대로 배포한 뒤 .../exec 를 넣는다.
  // 비어 있으면 이 기기에서 초안으로 편집한다 (공유 안 됨). 하데스타운 서버를 재사용하면 그쪽 데이터를 덮어쓰니 새로 배포할 것.
  var SERVER = "https://script.google.com/macros/s/AKfycbwQqZtWy82qEwzB92ioxwHgqV8T5qLl7Km2qY6vLraToenyAlxwyj2bLRG9QZZNntBVqQ/exec";
  var PIN_KEY = "chicago-binder-pin", SERVER_KEY = "chicago-binder-server", DRAFT_KEY = "chicago-binder-draft";

  var state = JSON.parse(document.getElementById("app-state").textContent);

  function migrate(st){
    (st.scenes || []).forEach(function(c){ if (!c.props) c.props = []; });
    if (!st.scoreDocs) st.scoreDocs = [];
    if (!st.files) st.files = [];
    if (!st.sessions) st.sessions = [];
    if (!st.people) st.people = [];
    if (!st.show) st.show = {};
    if (!st.cues) st.cues = [];
    ["members", "songs", "scenes"].forEach(function(k){ if (!st[k]) st[k] = []; });
    st.sessions.forEach(function(s){
      if (typeof s.start !== "string") s.start = "";
      if (typeof s.end !== "string") s.end = "";
      if (typeof s.plan !== "string") s.plan = "";
      if (typeof s.concept !== "string") s.concept = "";
      s.off = !!s.off;
    });
    (st.songs || []).forEach(function(s){
      if (!s.short) s.short = s.title;
      if (!s.slug) s.slug = s.id;
      if (typeof s.lyrics !== "string") s.lyrics = "";
    });
    st.files.forEach(function(f){ if (!f.group) f.group = f.kind === "pdf" ? "score" : f.kind === "audio" ? "audio" : "etc"; });
    return st;
  }
  migrate(state);
  function applyDraft(){
    if (serverUrl()) return;
    try{

  /* ── 곡 선택 (모든 탭 공통) ─────────── */
  var SONG_KEY = "chicago-binder-song", PART_KEY = "chicago-binder-part";

  function isDark(){
    var t = document.documentElement.getAttribute("data-theme");

  function songColor(sg){ return (isDark() && sg.colorDark) || sg.color || ""; }
  function applySongTheme(){
    var sg = curSong(), root = document.documentElement.style, c = sg ? songColor(sg) : "";
    if (c){
      root.setProperty("--song", c);

  async function readJson(r){
    if (!r.ok) throw new Error("http " + r.status);
    var text = await r.text();
    var j = null;
    try{ j = JSON.parse(text); }catch(e){}
    if (!j || typeof j !== "object"){
      throw new Error(/<html|<!doctype|<script/i.test(text) ? "html" : "bad");
    }
    return j;
  }
  async function apiPost(body){
    var r = await fetch(serverUrl(), {
      method: "POST",
      redirect: "follow",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    });
    return readJson(r);
  }
  async function apiGet(){
    var base = serverUrl();
    var r = await fetch(base + (base.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), {cache:"no-store", redirect:"follow"});
    var j = await readJson(r);
    if (!j.ok) throw new Error("bad");
    return j;
  }
  // 왜 실패했는지 사람이 읽을 수 있게
  function explainErr(e){
    var m = String((e && e.message) || e || "");
    if (m === "html") return "서버가 JSON 대신 웹페이지를 보냈어요 — 배포 설정에서 '액세스 권한: 모든 사용자', '실행 사용자: 나'인지 확인 후 새 버전으로 다시 배포";
    if (m === "bad") return "서버 응답 형식이 이상해요 — server.gs가 전부 붙여넣어졌는지 확인";
    if (/^http /.test(m)) return "서버 오류 (HTTP " + m.slice(5) + ")";
    return "서버가 요청을 거부했어요(CORS). 십중팔구 배포 설정 문제 — Apps Script ▸ 배포 ▸ 배포 관리 ▸ 연필 ▸ 버전: 새 버전, 액세스 권한: '모든 사용자', 실행 사용자: '나' ▸ 배포. (그 외: 주소가 .../exec 로 끝나는지, 인터넷 연결)";
  }
  function adminMsg(text){

  var saveTimer = null, failCount = 0, serverHasPin = false;
  function schedulePersist(){
    if (!isAdmin()) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 1500);
  }
  async function persist(){
    saveTimer = null;
    if (!isAdmin()) return;
    if (!serverUrl()){
      try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); setStatus("saved", "초안 · 이 기기에 저장"); }
      catch(e){ setStatus("error", "저장 실패"); }
      return;
    }
    setStatus("saving", "저장 중…");
    try{
      var j = await apiPost({action:"saveSite", pin: pin(), site: state});
      if (!j.ok){
        if (j.error === "bad_pin"){ logout(); setStatus("error", "비밀번호가 바뀌었어요"); return; }
        throw new Error(j.error || "save");
      }
      failCount = 0;
      setStatus("saved", "저장됨");
    }catch(e){
      failCount++;
      if (failCount <= 3){ setStatus("saving", "저장 재시도…"); schedulePersist(); }
      else { failCount = 0; setStatus("error", "저장 실패"); }
    }
  }

    setStatus(admin ? "saved" : "idle", !serverUrl() ? "초안 · 이 기기에 저장" : admin ? "관리자" : "보기 전용");
    document.getElementById("btn-change-pin").hidden = !serverUrl();

    }else if (!serverHasPin){
      hint.textContent = "아직 관리자 비밀번호가 없어요. 지금 입력하는 비밀번호(4자 이상)가 관리자 비밀번호로 정해집니다.";
    }else{
      hint.textContent = "편집은 관리자만 가능합니다. 비밀번호는 이 브라우저에만 저장됩니다.";

  chip.addEventListener("click", function(){

  document.getElementById("btn-login").addEventListener("click", async function(){

  document.getElementById("btn-reset-site").addEventListener("click", async function(){
    if (!isAdmin()) return;
    if (!serverUrl()){
      if (!confirm("이 기기의 초안을 지울까요? 먼저 설정 탭에서 내보내 두면 되살릴 수 있어요.")) return;

  document.getElementById("btn-srv-save").addEventListener("click", function(){

  document.getElementById("btn-srv-test").addEventListener("click", async function(){

  document.getElementById("btn-logout").addEventListener("click", logout);

  // 1) 저장소의 data.json (기본값) → 2) 서버에 관리자가 저장한 데이터가 있으면 그걸로 덮어씀
  //    단, 자료실(files)·문서(scoreDocs)·큐시트(cues)는 원본 파일에서 만들므로 항상 data.json이 기준
  var REPO_KEYS = ["files", "scoreDocs", "cues"];

  }
  fetch("data.json", {cache:"no-store"})
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(j){
      repoFixed = {};
      REPO_KEYS.forEach(function(k){ if (Array.isArray(j[k])) repoFixed[k] = j[k]; });
      if (!serverApplied){ state = migrate(j); applyDraft(); applyRepoFixed(); renderAll(); }
      else { applyRepoFixed(); renderAll(); }
    })
    .catch(function(){});

  /* ── 탭 ─────────────────────── */
  function setTab(v){
    if (v === "setup" && !isAdmin()) v = "sched";

  var curSceneId = songScenes().length ? songScenes()[0].id : null;

  function curScene(){ return state.scenes.find(function(c){ return c.id===curSceneId; }); }
  function sceneIndex(){ return songScenes().findIndex(function(c){ return c.id===curSceneId; }); }

  function gotoScene(id, animate){
    curSceneId = id; selPropId = null;
    renderCueList(); renderStage(animate); renderCueMeta();
    var onBtn = document.querySelector('.cue[data-cue="' + id + '"]');
    if (onBtn){
      // 큐 목록만 움직인다 (페이지가 밀려 무대가 가리지 않게)
      var box = document.getElementById("cuelist"), l = box.getBoundingClientRect(), b = onBtn.getBoundingClientRect();
      box.scrollBy({
        left: b.left < l.left ? b.left - l.left : b.right > l.right ? b.right - l.right : 0,
        top: b.top < l.top ? b.top - l.top : b.bottom > l.bottom ? b.bottom - l.bottom : 0,
        behavior: "smooth"
      });
    }
  }

  function renderCueList(){
    var host = document.getElementById("cuelist");
    var scenes = songScenes();
    host.innerHTML = scenes.map(function(c, i){
      return '<button class="cue' + (c.id===curSceneId ? ' on' : '') + '" data-cue="' + c.id + '">' +
        '<span class="no">CUE ' + pad2(i+1) + '</span><span>' + esc(c.label) + '</span></button>';
    }).join("") + (scenes.length ? '<button class="cue add admin-only" data-newscene="blank">＋ 대형 추가</button>' : "");

    renderSongHead();

  // 새 대형: base가 있으면 그 배치를 복제, 없으면 멤버를 한 줄로 펼침
  function addScene(base){
    var sg = curSong(); if (!sg || !isAdmin()) return;
    var positions = {};
    if (base){ positions = JSON.parse(JSON.stringify(base.positions)); }
    else{
      var n = state.members.length;
      state.members.forEach(function(m, i){ positions[m.id] = [n > 1 ? Math.round(12 + 76 * i / (n-1)) : 50, 45]; });
    }
    var sc = {
      id: newId("c"), songId: sg.id,
      label: base ? base.label + " (복제)" : "새 대형", note: "",
      positions: positions,
      props: base ? JSON.parse(JSON.stringify(base.props)).map(function(p){ p.id = newId("p"); return p; }) : []
    };
    var list = songScenes();
    var at = list.length ? state.scenes.indexOf(list[list.length-1]) + 1 : state.scenes.length;
    state.scenes.splice(at, 0, sc);
    gotoScene(sc.id, false);
    schedulePersist();
  }
  function onNewScene(kind){
    if (kind === "copy"){
      var others = state.scenes.filter(function(c){ return c.songId !== curSongId; });
      addScene(others.length ? others[others.length-1] : null);
    }else addScene(null);
  }

        '<path d="M8 37 L17 30 L26 37 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
        '</svg>';
    }
    // 의자(스툴): 좌판 + 다리
    return '<svg viewBox="0 0 34 40" aria-hidden="true">' +
      '<rect x="7" y="10" width="20" height="6" rx="2" fill="currentColor"/>' +
      '<line x1="10" y1="16" x2="8" y2="34" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
      '<line x1="24" y1="16" x2="26" y2="34" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +

      '</svg>';

  function renderStage(animate){
    stage.querySelectorAll(".mchip, .pchip, .spike").forEach(function(n){ n.remove(); });
    [[50,50]].forEach(function(p){
      var s = document.createElement("div");
      s.className = "spike"; s.style.left = p[0] + "%"; s.style.top = p[1] + "%";
      stage.appendChild(s);
    });
    var sc = curScene();
    if (!sc) return;
    sc.props.forEach(function(p){
      var el = document.createElement("div");
      el.className = "pchip" + (animate ? " anim" : "") + (p.id === selPropId ? " sel" : "");
      el.dataset.pid = p.id;
      el.style.left = p.x + "%";
      el.style.top = p.y + "%";
      el.innerHTML = propSvg(p.type) +
        '<button class="px" data-px="' + p.id + '" aria-label="소품 삭제">✕</button>';
      stage.appendChild(el);
    });
    state.members.forEach(function(m){
      var pos = sc.positions[m.id] || [50,50];
      var el = document.createElement("div");
      el.className = "mchip" + (animate ? " anim" : "");
      el.dataset.mid = m.id;
      el.style.setProperty("--c", m.color);
      el.style.left = pos[0] + "%";
      el.style.top = pos[1] + "%";
      el.innerHTML = '<span class="dot">' + esc(m.no || m.name.slice(0, 2)) + '</span><span class="tag">' + esc(m.short || m.name) + '</span>';
      stage.appendChild(el);
    });
  }

  // 드래그 (멤버 + 소품 공통, 관리자 전용) / 짧은 탭이면 소품 선택 토글
  var dragEl = null, dragMoved = false, downX = 0, downY = 0;
  stage.addEventListener("pointerdown", function(e){
    if (!isAdmin()) return;
    if (e.target.closest(".px")) return; // 삭제 버튼은 클릭으로 처리
    var chipEl = e.target.closest(".mchip, .pchip");
    if (!chipEl){
      if (selPropId){ selPropId = null; renderStage(false); }
      return;
    }
    dragEl = chipEl; dragMoved = false;
    downX = e.clientX; downY = e.clientY;
    chipEl.classList.add("drag");
    chipEl.classList.remove("anim");
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener("pointermove", function(e){
    if (!dragEl) return;
    if (!dragMoved && Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 6) return;
    dragMoved = true;
    var r = stage.getBoundingClientRect();
    var x = Math.min(97, Math.max(3, (e.clientX - r.left) / r.width * 100));
    var y = Math.min(97, Math.max(10, (e.clientY - r.top) / r.height * 100));
    dragEl.style.left = x + "%";
    dragEl.style.top = y + "%";
  });
  function endDrag(){
    if (!dragEl) return;
    var el = dragEl;
    dragEl = null;
    el.classList.remove("drag");
    var sc = curScene();
    if (!sc) return;
    if (!dragMoved){
      // 짧은 탭: 소품이면 선택 토글
      if (el.dataset.pid){
        selPropId = (selPropId === el.dataset.pid) ? null : el.dataset.pid;
        renderStage(false);
      }else if (selPropId){
        selPropId = null; renderStage(false);
      }
      return;
    }
    var x = Math.round(parseFloat(el.style.left) * 10) / 10;
    var y = Math.round(parseFloat(el.style.top) * 10) / 10;
    if (el.dataset.mid){
      sc.positions[el.dataset.mid] = [x, y];
    }else if (el.dataset.pid){
      var p = sc.props.find(function(q){ return q.id === el.dataset.pid; });
      if (p){ p.x = x; p.y = y; }
    }
    schedulePersist();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("click", function(e){
    if (!isAdmin()) return;
    var px = e.target.closest("[data-px]");
    if (!px) return;
    var sc = curScene(); if (!sc) return;
    var idx = sc.props.findIndex(function(p){ return p.id === px.dataset.px; });
    if (idx >= 0){
      sc.props.splice(idx, 1);
      selPropId = null;
      renderStage(false);
      schedulePersist();
    }
  });

  function addProp(type){
    var sc = curScene(); if (!sc) return;
    var p = {id: newId("p"), type: type, x: 50, y: 50};
    sc.props.push(p);
    selPropId = p.id;
    renderStage(false);
    schedulePersist();
  }
  document.getElementById("btn-add-mic").addEventListener("click", function(){ addProp("mic"); });
  document.getElementById("btn-add-chair").addEventListener("click", function(){ addProp("chair"); });

  function renderLegend(){
    document.getElementById("legend").innerHTML = state.members.map(function(m){
      return '<span style="--c:' + esc(m.color) + '"><i></i>' + (m.no ? m.no + ' ' : '') + esc(m.name) + (m.role ? ' · ' + esc(m.role) : '') + '</span>';
    }).join("");
  }

  var labelInput = document.getElementById("cue-label");
  var noteInput = document.getElementById("cue-note");
  function renderCueMeta(){
    var sc = curScene();
    labelInput.value = sc ? sc.label : "";
    noteInput.value = sc ? sc.note : "";
    var i = sceneIndex();
    document.getElementById("cue-now").textContent =
      sc ? "CUE " + String(i+1).padStart(2,"0") + " — " + sc.label : "";
    document.getElementById("btn-prev").disabled = i <= 0;
    document.getElementById("btn-next").disabled = i < 0 || i >= songScenes().length - 1;
  }
  labelInput.addEventListener("input", function(){
    var sc = curScene(); if (!sc || !isAdmin()) return;
    sc.label = labelInput.value; renderCueList();
    document.getElementById("cue-now").textContent =
      "CUE " + String(sceneIndex()+1).padStart(2,"0") + " — " + sc.label;
    schedulePersist();
  });
  noteInput.addEventListener("input", function(){
    var sc = curScene(); if (!sc || !isAdmin()) return;
    sc.note = noteInput.value; schedulePersist();
  });

  document.getElementById("btn-dup").addEventListener("click", function(){
    var sc = curScene(); if (!sc) return;
    var copy = {
      id: newId("c"),
      songId: sc.songId,
      label: sc.label + " (복제)",
      note: "",
      positions: JSON.parse(JSON.stringify(sc.positions)),
      props: JSON.parse(JSON.stringify(sc.props)).map(function(p){ p.id = newId("p"); return p; })
    };
    state.scenes.splice(state.scenes.indexOf(sc) + 1, 0, copy);
    gotoScene(copy.id, false);
    schedulePersist();
  });
  document.getElementById("btn-del").addEventListener("click", function(){
    var list = songScenes(), idx = sceneIndex();
    if (idx < 0) return;
    state.scenes.splice(state.scenes.indexOf(list[idx]), 1);
    list = songScenes();
    gotoScene(list.length ? list[Math.max(0, idx-1)].id : null, true);
    schedulePersist();
  });

  /* ── 가사집 ─────────────────────── */
  var editingSong = null;
  function lyricsHtml(text){
    return text.split("\n").map(function(line){
      var t = line.trim();
      if (!t) return "<p>&nbsp;</p>";
      if (/^\[.+\]$/.test(t)) return '<div class="sec">' + esc(t.slice(1,-1).toUpperCase()) + '</div>';
      if (/^\(.+\)$/.test(t)) return '<p class="echo">' + esc(line) + '</p>';
      return "<p>" + esc(line) + "</p>";
    }).join("");
  }
  var lyricsDirty = false;
  function renderLyrics(){
    var host = document.getElementById("lyrics-col");
    var editing = !!(editingSong && isAdmin());
    host.classList.toggle("editing", editing);
    host.innerHTML = [curSong()].filter(Boolean).map(function(s){
      var i = state.songs.indexOf(s);
      var body, isEd = editingSong === s.id && isAdmin();
      if (isEd){
        body = '<div class="lyric-edit" data-ledit-wrap="' + s.id + '">' +
          '<div class="toolbar">' +
            '<button class="btn primary" data-lsave="' + s.id + '">저장</button>' +
            '<button class="btn" data-lcancel="' + s.id + '">취소</button>' +
            '<span class="dirty">● 저장 안 됨</span>' +
            '<span class="sp"></span>' +
            '<button class="btn ins" data-lins="sec" title="현재 줄을 [파트] 표시로">[파트]</button>' +
            '<button class="btn ins" data-lins="echo" title="현재 줄을 (에코) 표시로">(에코)</button>' +
            '<button class="btn ins" data-lins="break" title="댄스 브레이크 표시 삽입">[★ 브레이크]</button>' +
            '<span class="hint"><span class="kbd">Ctrl+S</span> 저장 <span class="kbd">Esc</span> 취소</span>' +
          '</div>' +
          '<div class="panes">' +
            '<textarea data-ta="' + s.id + '" spellcheck="false" placeholder="[파트]&#10;가사 줄&#10;(에코)">' + esc(s.lyrics) + '</textarea>' +
            '<div class="preview" data-lprev="' + s.id + '"><p class="plabel">미리보기</p>' +
              '<div class="lyric-body">' + lyricsHtml(s.lyrics) + '</div></div>' +
          '</div>' +
          '<div class="row">' +
            '<button class="btn primary" data-lsave="' + s.id + '">저장</button>' +
            '<button class="btn" data-lcancel="' + s.id + '">취소</button>' +
          '</div></div>';
      }else if (!s.lyrics.trim()){
        body = '<div class="lyric-body"><p class="lyric-empty">가사가 아직 없어요.' +
          (isAdmin() ? ' 「편집」을 눌러 붙여넣으세요. 파트는 [록시], 에코는 (앙상블: …) 형식으로 쓰면 자동으로 구분돼요.' : '') + '</p></div>';
      }else{
        body = '<div class="lyric-body">' + lyricsHtml(s.lyrics) + '</div>';
      }
      return '<article class="songcard' + (isEd ? ' editing' : '') + '" id="song-' + s.id + '">' +
        '<div class="head"><span class="glabel">가사</span>' +
        (isEd || !isAdmin() ? "" : '<button class="btn" data-ledit="' + s.id + '">편집</button>') +
        '</div>' + body + '</article>';
    }).join("");
    if (!curSong()) host.innerHTML = '<p class="pdf-msg">곡을 추가하면 가사를 넣을 수 있어요.</p>';
    lyricsDirty = false;
  }
  function lyricTA(id){ return document.querySelector('[data-ta="' + id + '"]'); }
  function updateLyricPreview(id){
    var ta = lyricTA(id), pv = document.querySelector('[data-lprev="' + id + '"] .lyric-body');
    if (!ta || !pv) return;
    pv.innerHTML = lyricsHtml(ta.value);
  }
  function saveLyrics(id){
    var song = songById(id), ta = lyricTA(id);
    if (song && ta){ song.lyrics = ta.value; schedulePersist(); }
    editingSong = null; renderLyrics();
  }
  function cancelLyrics(){ editingSong = null; renderLyrics(); }
  /* 현재 커서 줄을 [..] 또는 (..)로 감싸기 / 브레이크 표시 삽입 */
  function insertLyricMark(ta, kind){
    var v = ta.value, pos = ta.selectionStart;
    var ls = v.lastIndexOf("\n", pos - 1) + 1;
    var le = v.indexOf("\n", pos); if (le < 0) le = v.length;
    var line = v.slice(ls, le), t = line.trim(), out, caret;
    if (kind === "break"){
      var ins = (t ? "\n" : "") + "[★ 댄스 브레이크]";
      out = v.slice(0, le) + ins + v.slice(le);
      caret = le + ins.length - 1;
    }else{
      var o = kind === "sec" ? "[" : "(", c = kind === "sec" ? "]" : ")";
      var m = t.match(/^[\[(](.*)[\])]$/);
      var inner = m ? m[1] : t;
      var nl = o + inner + c;
      out = v.slice(0, ls) + nl + v.slice(le);
      caret = ls + (inner ? nl.length : 1);
    }
    ta.value = out;
    ta.setSelectionRange(caret, caret);
    ta.focus();
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }
  var lyricsCol = document.getElementById("lyrics-col");
  lyricsCol.addEventListener("click", function(e){
    if (!isAdmin()) return;
    var b;
    if ((b = e.target.closest("[data-ledit]"))){
      editingSong = b.dataset.ledit; renderLyrics();
      var card = document.getElementById("song-" + editingSong);
      if (card && card.scrollIntoView) card.scrollIntoView({block:"start"});
      var ta = lyricTA(editingSong);
      if (ta){ ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0; }
    }else if ((b = e.target.closest("[data-lsave]"))){
      saveLyrics(b.dataset.lsave);
    }else if ((b = e.target.closest("[data-lcancel]"))){
      cancelLyrics();
    }else if ((b = e.target.closest("[data-lins]"))){
      var ta3 = lyricTA(editingSong);
      if (ta3) insertLyricMark(ta3, b.dataset.lins);
    }
  });
  lyricsCol.addEventListener("input", function(e){
    var ta = e.target.closest("[data-ta]"); if (!ta) return;
    var id = ta.dataset.ta, song = songById(id);
    lyricsDirty = !!song && song.lyrics !== ta.value;
    var wrap = ta.closest(".lyric-edit"); if (wrap) wrap.classList.toggle("dirty", lyricsDirty);
    updateLyricPreview(id);
  });
  /* 편집기 스크롤에 맞춰 미리보기도 비례 스크롤 */
  lyricsCol.addEventListener("scroll", function(e){
    var ta = e.target && e.target.closest ? e.target.closest("[data-ta]") : null; if (!ta) return;
    var pv = document.querySelector('[data-lprev="' + ta.dataset.ta + '"]'); if (!pv) return;
    var max = ta.scrollHeight - ta.clientHeight; if (max <= 0) return;
    pv.scrollTop = (ta.scrollTop / max) * (pv.scrollHeight - pv.clientHeight);
  }, true);
  lyricsCol.addEventListener("keydown", function(e){
    var ta = e.target.closest("[data-ta]"); if (!ta) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")){
      e.preventDefault(); saveLyrics(ta.dataset.ta);
    }else if (e.key === "Escape"){
      e.preventDefault(); cancelLyrics();
    }
  });
  window.addEventListener("beforeunload", function(e){
    if (editingSong && lyricsDirty){ e.preventDefault(); e.returnValue = ""; }
  });

  /* ── 악보 (PDF 뷰어) ─────────────── */
  if (window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  var curDocId = null, loadedDocId = null;
  function songDocs(){
    return (state.scoreDocs || []).filter(function(d){ return !d.songId || d.songId === curSongId; });
  }
  function renderScoreDocs(){
    var docs = songDocs();
    if (!docs.find(function(d){ return d.id===curDocId; })){
      curDocId = docs.length ? docs[0].id : null;
    }
    document.getElementById("doc-chips").innerHTML = docs.length < 2 ? "" : docs.map(function(d){
      return '<button class="doc-chip' + (d.id===curDocId ? ' on' : '') + '" data-doc="' + d.id + '">' + esc(d.title) + '</button>';
    }).join("");
    var cur = docs.find(function(d){ return d.id===curDocId; });
    document.getElementById("doc-actions").innerHTML = cur
      ? '<a class="btn" href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭</a>' +
        '<a class="btn" href="' + esc(cur.path) + '" download>다운로드</a>'
      : "";
  }
  function loadCurDoc(){
    var docs = songDocs();
    var cur = docs.find(function(d){ return d.id===curDocId; });
    var host = document.getElementById("pdf-pages");
    if (!cur){ host.innerHTML = '<p class="pdf-msg">등록된 악보가 없어요.</p>'; return; }
    if (loadedDocId === cur.id) return;
    loadedDocId = cur.id;
    if (!window.pdfjsLib){
      host.innerHTML = '<p class="pdf-msg">PDF 미리보기를 불러오지 못했어요 — <a href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭에서 열기</a></p>';
      return;
    }
    host.innerHTML = '<p class="pdf-msg">악보 불러오는 중…</p>';
    pdfjsLib.getDocument(cur.path).promise.then(function(pdf){
      if (loadedDocId !== cur.id) return;
      host.innerHTML = "";
      var width = Math.min(host.clientWidth || 800, 860);
      var chain = Promise.resolve();
      for (var p = 1; p <= pdf.numPages; p++){
        (function(pageNo){
          var canvas = document.createElement("canvas");
          host.appendChild(canvas);
          chain = chain.then(function(){
            return pdf.getPage(pageNo).then(function(page){
              var vp1 = page.getViewport({scale:1});
              var scale = width / vp1.width * Math.min(window.devicePixelRatio || 1, 2);
              var vp = page.getViewport({scale:scale});
              canvas.width = vp.width; canvas.height = vp.height;
              return page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
            });
          });
        })(p);
      }
    }).catch(function(){
      if (loadedDocId !== cur.id) return;
      host.innerHTML = '<p class="pdf-msg">PDF 미리보기 실패 — <a href="' + esc(cur.path) + '" target="_blank" rel="noopener">새 탭에서 열기</a></p>';
    });
  }
  document.getElementById("doc-chips").addEventListener("click", function(e){
    var b = e.target.closest("[data-doc]");
    if (!b) return;
    curDocId = b.dataset.doc;
    renderScoreDocs(); loadCurDoc();
  });

  /* ── 자료실: 곡별 묶음 + 파트 가이드 칩 ─────────── */
  var FILE_ICON = {pdf:"PDF", audio:"MP3", video:"MP4", doc:"DOC"};
  var curGuide = {};   // songId → 선택된 파트
  function myPart(){ try{ return localStorage.getItem(PART_KEY) || ""; }catch(e){ return ""; } }
  function allParts(){
    var seen = {}, out = [];
    state.files.forEach(function(f){
      if (f.group !== "guide" || !f.part || seen[f.part]) return;
      seen[f.part] = 1; out.push({part: f.part, label: f.label || f.part});
    });
    return out;
  }
  function fileRow(f){
    var i = state.files.indexOf(f);
    var canPlay = f.kind === "audio" || f.kind === "video";
    var doc = f.group === "score" && (state.scoreDocs || []).find(function(d){ return d.path === f.path; });
    return '<div class="filerow">' +
      '<div class="f-ic">' + (FILE_ICON[f.kind] || "FILE") + '</div>' +
      '<div class="f-info"><div class="f-name">' + esc(f.name) + '</div>' +
      '<div class="f-meta">' + esc(f.size) + '</div></div>' +
      (doc ? '<button class="btn" data-godoc="' + doc.id + '">보기</button>' : "") +
      (canPlay ? '<button class="btn" data-fplay="' + i + '">재생</button>' : "") +
      '<a class="btn" href="' + esc(f.path) + '" download>다운로드</a>' +
      '</div>' +
      '<div class="f-player" data-fslot="' + i + '"></div>';
  }
  function fgroup(title, inner, full, count){
    return '<div class="fgroup' + (full ? ' full' : '') + '"><h3>' + title +
      (count ? ' <span class="cnt">' + count + '</span>' : '') + '</h3>' + inner + '</div>';
  }
  function renderFiles(){
    var all = state.files || [], sid = curSongId;
    var by = {score:[], audio:[], guide:[], etc:[]}, common = [];
    all.forEach(function(f){
      if (!f.songId) common.push(f);
      else if (f.songId === sid) (by[f.group] || by.etc).push(f);
    });
    var html = "";
    if (by.score.length) html += fgroup("악보", by.score.map(fileRow).join(""));
    if (by.audio.length) html += fgroup("음원", by.audio.map(fileRow).join(""));
    if (by.guide.length){
      var mine = myPart();
      var sel = curGuide[sid] || (by.guide.find(function(g){ return g.part === mine; }) || by.guide[0]).part;
      var cur = by.guide.find(function(g){ return g.part === sel; }) || by.guide[0];
      var inner =
        '<div class="mypart"><label for="my-part">내 파트</label>' +
        '<select id="my-part"><option value="">선택 안 함</option>' +
        allParts().map(function(p){
          return '<option value="' + esc(p.part) + '"' + (p.part === mine ? ' selected' : '') + '>' +
            esc(p.label !== p.part ? p.part + " · " + p.label : p.part) + '</option>';
        }).join("") + '</select>' +
        '<span>고르면 모든 곡에서 내 가이드가 먼저 잡혀요</span></div>' +
        '<div class="chips">' + by.guide.map(function(g){
          return '<button class="chip' + (g === cur ? ' on' : '') + (g.part === mine ? ' mine' : '') + '" data-gchip="' + esc(g.part) + '">' +
            '<span class="k">' + esc(g.part) + '</span>' +
            (g.label && g.label !== g.part ? esc(g.label) : '') +
            (g.part === mine ? '<span class="star">★</span>' : '') + '</button>';
        }).join("") + '</div>' +
        fileRow(cur);
      html += fgroup("파트 가이드", inner, true, by.guide.length);
    }
    var rest = by.etc.concat(common);
    if (rest.length) html += fgroup(common.length && by.etc.length ? "기타 · 공통" : common.length ? "공통" : "기타", rest.map(fileRow).join(""), true);
    document.getElementById("files-list").innerHTML = html || '<p class="pdf-msg">등록된 파일이 없어요.</p>';
  }
  function playFile(i, btn){
    var f = state.files[i];
    var slot = document.querySelector('[data-fslot="' + i + '"]');
    if (!f || !slot) return;
    var wasOpen = slot.innerHTML !== "";
    document.querySelectorAll(".f-player").forEach(function(x){ x.innerHTML = ""; });
    document.querySelectorAll("[data-fplay]").forEach(function(x){ x.textContent = "재생"; });
    if (wasOpen) return;
    slot.innerHTML = f.kind === "audio"
      ? '<audio controls autoplay preload="none" src="' + esc(f.path) + '"></audio>'
      : '<video controls autoplay preload="none" playsinline src="' + esc(f.path) + '"></video>';
    if (btn) btn.textContent = "닫기";
  }
  document.getElementById("files-list").addEventListener("click", function(e){
    var b;
    if ((b = e.target.closest("[data-fplay]"))){ playFile(+b.dataset.fplay, b); return; }
    if ((b = e.target.closest("[data-godoc]"))){ curDocId = b.dataset.godoc; renderScoreDocs(); setTab("scores"); return; }
    if ((b = e.target.closest("[data-gchip]"))){
      curGuide[curSongId] = b.dataset.gchip;
      renderFiles();
      var play = document.querySelector('.fgroup .chips + .filerow [data-fplay]');
      if (play) playFile(+play.dataset.fplay, play);
    }
  });
  document.getElementById("files-list").addEventListener("change", function(e){
    if (e.target.id !== "my-part") return;
    try{
      if (e.target.value) localStorage.setItem(PART_KEY, e.target.value);
      else localStorage.removeItem(PART_KEY);
    }catch(x){}
    curGuide = {};
    renderFiles();
  });


  /* ── 일정표 · 출결 ───────────────── */
  var ME_KEY = "chicago-binder-me", ATT_KEY = "chicago-binder-att";
  var ST_NAME = {y:"출석", l:"지각", n:"결석", "":"미응답"};
  var WD = ["일","월","화","수","목","금","토"];
  var att = {}, meId = "", pulledFor = null, showPast = false;
  var flipped = {}, openRoster = {};

  try{ meId = localStorage.getItem(ME_KEY) || ""; }catch(e){}
  try{ att = JSON.parse(localStorage.getItem(ATT_KEY) || "{}") || {}; }catch(e){ att = {}; }
  function saveAttLocal(){ try{ localStorage.setItem(ATT_KEY, JSON.stringify(att)); }catch(e){} }

  function sessionList(){
    return (state.sessions || []).slice().sort(function(a,b){
      return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0;
    });
  }
  function sessionById(id){ return (state.sessions || []).find(function(s){ return s.id === id; }); }
  function peopleList(){ return state.people || []; }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(iso){ var a = String(iso).split("-"); return [+a[0], +a[1], +a[2]]; }
  function weekday(iso){ var p = ymd(iso); return WD[new Date(p[0], p[1]-1, p[2]).getDay()]; }
  function shortDate(iso){ var p = ymd(iso); return p[1] + "/" + p[2]; }
  function fullDate(iso){ var p = ymd(iso); return p[1] + "월 " + p[2] + "일 (" + weekday(iso) + ")"; }
  function dday(iso){
    var p = ymd(iso), a = new Date(p[0], p[1]-1, p[2]), t = new Date();
    t.setHours(0,0,0,0);
    return Math.round((a - t) / 86400000);
  }
  function statusOf(sid, mid){ return (att[sid] || {})[mid] || ""; }
  function countOf(sid){
    var c = {y:0, l:0, n:0, u:0};
    peopleList().forEach(function(m){ c[statusOf(sid, m.id) || "u"]++; });
    return c;
  }

  /* 동기화 */
  var syncChip = document.getElementById("att-sync");
  var syncLabel = document.getElementById("att-sync-label");
  function setSync(s, label){ syncChip.dataset.s = s; syncLabel.textContent = label; }

  // 서버에서 출결(+관리자가 저장한 사이트 데이터) 가져오기
  async function pullAll(silent, initial){
    if (!serverUrl()){ setSync("idle", "이 기기에만 저장"); return; }
    if (!silent) setSync("busy", "불러오는 중…");
    try{
      var j = await apiGet();
      serverHasPin = !!j.hasPin;
      att = (j.att && typeof j.att === "object") ? j.att : {};
      saveAttLocal();
      // 관리자가 편집 중일 땐 화면을 갈아엎지 않는다 (처음 로드는 예외)
      if (j.site && (initial || (!isAdmin() && editingSong === null))){
        serverApplied = true;
        state = migrate(j.site);
        applyRepoFixed();
        renderAll();
      }else{
        renderSched();
      }
      setSync("ok", "모두와 공유됨");
      if (!isAdmin()) applyMode();
    }catch(e){
      setSync("err", "서버 연결 실패");
      adminMsg("서버 연결 실패: " + explainErr(e));
    }
  }
  async function pushAtt(sid, mid, status){
    if (!att[sid]) att[sid] = {};
    if (status) att[sid][mid] = status; else delete att[sid][mid];
    saveAttLocal();
    if (!serverUrl()){ setSync("idle", "이 기기에만 저장"); return; }
    setSync("busy", "저장 중…");
    try{
      var j = await apiPost({action:"att", sessionId: sid, memberId: mid, status: status});
      if (!j.ok) throw 0;
      if (j.att){ att = j.att; saveAttLocal(); renderSched(); }
      setSync("ok", "저장됨 · 공유");
    }catch(e){
      setSync("err", "저장 실패 — 새로고침 후 다시");
    }
  }
  function maybePull(){
    var base = serverUrl();
    if (!base){ setSync("idle", "이 기기에만 저장"); return; }
    if (pulledFor !== base){ pulledFor = base; pullAll(true, true); }
  }

  /* 내 이름 — 한 번 고르면 기기에 저장, 이후엔 한 줄로 접힘 */

    meSel.innerHTML = '<option value="">— 이름을 골라주세요 —</option>' + ms.map(function(m){
      return '<option value="' + esc(m.id) + '"' + (m.id === meId ? " selected" : "") + '>' + esc(m.name) + "</option>";
    }).join("");

  function renderMeBar(){
    var me = peopleList().find(function(m){ return m.id === meId; });

    set.hidden = !!me && !meChanging;
    now.hidden = !me || meChanging;

      if (me.color) now.style.setProperty("--c", me.color); else now.style.removeProperty("--c");

  function askMe(){
    meChanging = true; renderMeBar();
    meSel.focus();
    meSel.scrollIntoView({block:"center", behavior:"smooth"});
  }
  meSel.addEventListener("change", function(){
    meId = meSel.value;
    try{ meId ? localStorage.setItem(ME_KEY, meId) : localStorage.removeItem(ME_KEY); }catch(e){}
    meChanging = false;
    renderMeBar();
    renderSched();
    renderCues();
  });
  document.getElementById("btn-me-change").addEventListener("click", askMe);

  /* 바 하나 */
  function countHtml(sid){
    var c = countOf(sid);
    return '<button class="cnt" data-roster="' + esc(sid) + '" title="명단 보기">' +
      '<i class="y">출 ' + c.y + "</i><i class=\"l\">지 " + c.l + "</i><i class=\"n\">결 " + c.n + "</i></button>";
  }
  function rosterHtml(sid){
    return [["y","출석"],["l","지각"],["n","결석"],["u","미응답"]].map(function(g){
      var names = peopleList().filter(function(m){
        return (statusOf(sid, m.id) || "u") === g[0];
      }).map(function(m){ return m.name; });
      return '<div class="' + g[0] + '"><b>' + g[1] + " " + names.length + "</b>" +
        (names.length ? esc(names.join(", ")) : "—") + "</div>";
    }).join("");
  }
  function timeLabel(s){ return s.start ? s.start + (s.end ? "–" + s.end : "~") : "시간 미정"; }
  function planHtml(s){
    if (isAdmin()) return '<textarea class="sb-plan-in" data-plan="' + esc(s.id) + '" rows="' + Math.max(2, s.plan.split("\n").length) + '" placeholder="연습 진행 순서 (줄마다 하나)">' + esc(s.plan) + "</textarea>";
    return s.plan ? '<div class="sb-plan">' + s.plan.split("\n").map(function(l){ return "<div>" + esc(l) + "</div>"; }).join("") + "</div>" : "";
  }
  function barHtml(s){
    var d = dday(s.dateISO), my = statusOf(s.id, meId), admin = isAdmin();
    var cls = "sbar" + (s.off ? " off" : "") + (d === 0 ? " today" : "") + (d < 0 ? " past" : "") +
      (flipped[s.id] && !s.off ? " flip" : "") + (openRoster[s.id] ? " open" : "");
    var badge = s.off ? "휴강" : d === 0 ? "오늘" : d > 0 ? "D-" + d : "";
    var dateBlock = '<div class="sb-date"><b>' + esc(shortDate(s.dateISO)) + "</b><span>" +
      esc(weekday(s.dateISO)) + (badge ? "<em>" + esc(badge) + "</em>" : "") + "</span></div>";

    var con = admin
      ? '<input class="sb-con-in" data-con="' + esc(s.id) + '" value="' + esc(s.concept || "") + '" placeholder="장소·메모">'
      : '<div class="sb-con' + (s.concept ? "" : " empty") + '">' + esc(s.off ? "휴강" : (s.concept || "내용 미정")) + "</div>";

    var front = '<div class="sbar-face front">' + dateBlock +
      '<div class="sb-info">' + con +
        '<div class="sb-meta"><span>' + esc(timeLabel(s)) + "</span>" + (s.off ? "" : countHtml(s.id)) + "</div>" +
      "</div>" +
      (s.off
        ? ""
        : '<button class="sb-check' + (my ? "" : " none") + '" data-s="' + my + '" data-check="' + esc(s.id) + '">' +
          (my ? ST_NAME[my] : "출첵") + "</button>") +
      "</div>";

    var backBody = meId
      ? '<div class="sb-pick">' + ["y","l","n"].map(function(p){
          return '<button data-pick="' + p + '"' + (my === p ? ' class="on"' : "") + ">" + ST_NAME[p] + "</button>";
        }).join("") + "</div>"
      : '<div class="sb-need">먼저 내 이름을 골라주세요 <button class="btn" data-needme="1">이름 고르기</button></div>';
    var back = '<div class="sbar-face back">' + dateBlock + backBody +
      '<button class="sb-close" data-close="' + esc(s.id) + '" aria-label="닫기">✕</button></div>';

    var adminRow = admin
      ? '<div class="sb-admin">' +
        '<button class="btn" data-time="' + esc(s.id) + '">시간</button>' +
        '<button class="btn" data-off="' + esc(s.id) + '">' + (s.off ? "휴강 해제" : "휴강") + "</button>" +
        '<button class="btn warn" data-del="' + esc(s.id) + '">삭제</button></div>'
      : "";

    return '<div class="' + cls + '" data-ses="' + esc(s.id) + '">' +
      '<div class="sbar-in">' + front + back + "</div>" + planHtml(s) +
      '<div class="sb-roster"' + (openRoster[s.id] ? "" : " hidden") + ">" + rosterHtml(s.id) + "</div>" +
      adminRow + "</div>";
  }

  function renderSched(){
    var host = document.getElementById("sched-list");
    var ss = sessionList();
    if (!ss.length){ host.innerHTML = '<p class="sched-empty">등록된 회차가 없어요.</p>'; return; }
    var up = ss.filter(function(s){ return dday(s.dateISO) >= 0; });
    var past = ss.filter(function(s){ return dday(s.dateISO) < 0; }).reverse();
    var html = "";
    if (up.length){
      html += '<div class="sched-h">다가오는 연습</div>' + up.map(barHtml).join("");
    }else{
      html += '<p class="sched-empty">예정된 회차가 없어요.</p>';
    }
    if (past.length){
      html += '<button class="btn past-toggle" id="btn-past">' +
        (showPast ? "지난 회차 접기" : "지난 회차 " + past.length + "개 보기") + "</button>";
      if (showPast) html += '<div class="sched-h">지난 회차</div>' + past.map(barHtml).join("");
    }
    host.innerHTML = html;
  }

  /* 바 안에서 DOM만 고쳐서 애니메이션 유지 */
  function patchBar(sid){
    var bar = document.querySelector('.sbar[data-ses="' + sid + '"]');
    if (!bar) return;
    var my = statusOf(sid, meId);
    var chk = bar.querySelector(".sb-check");
    if (chk){
      chk.dataset.s = my;
      chk.classList.toggle("none", !my);
      chk.textContent = my ? ST_NAME[my] : "출첵";
    }
    bar.querySelectorAll("[data-pick]").forEach(function(b){ b.classList.toggle("on", b.dataset.pick === my); });
    var cnt = bar.querySelector(".cnt");
    if (cnt) cnt.outerHTML = countHtml(sid);
    var ro = bar.querySelector(".sb-roster");
    if (ro) ro.innerHTML = rosterHtml(sid);
  }

  document.getElementById("sched-list").addEventListener("click", function(e){
    var b, bar = e.target.closest(".sbar"), sid = bar ? bar.dataset.ses : null;
    if ((b = e.target.closest("[data-check]"))){
      flipped[sid] = true; bar.classList.add("flip");
    }else if ((b = e.target.closest("[data-close]"))){
      flipped[sid] = false; bar.classList.remove("flip");
    }else if ((b = e.target.closest("[data-pick]"))){
      if (!meId) return;
      pushAtt(sid, meId, b.dataset.pick);
      patchBar(sid);
      flipped[sid] = false; bar.classList.remove("flip");
    }else if ((b = e.target.closest("[data-needme]"))){
      flipped[sid] = false; bar.classList.remove("flip");
      askMe();
    }else if ((b = e.target.closest("[data-roster]"))){
      openRoster[sid] = !openRoster[sid];
      bar.classList.toggle("open", openRoster[sid]);
      bar.querySelector(".sb-roster").hidden = !openRoster[sid];
    }else if ((b = e.target.closest("#btn-past"))){
      showPast = !showPast; renderSched();
    }else if ((b = e.target.closest("[data-time]")) && isAdmin()){
      var st = sessionById(b.dataset.time);
      if (!st) return;
      var tv = prompt("연습 시간 (예: 19:00-21:00, 끝 시각은 생략 가능)", st.start + (st.end ? "-" + st.end : ""));
      var tm = tv && tv.trim().match(/^(\d{1,2}:\d{2})(?:\s*[-–~]\s*(\d{1,2}:\d{2})?)?$/);
      if (!tm) return;
      st.start = tm[1]; st.end = tm[2] || "";
      schedulePersist(); renderSched();
    }else if ((b = e.target.closest("[data-off]")) && isAdmin()){
      var s = sessionById(b.dataset.off);
      if (!s) return;
      s.off = !s.off; schedulePersist(); renderSched();
    }else if ((b = e.target.closest("[data-del]")) && isAdmin()){
      var s2 = sessionById(b.dataset.del);
      if (!s2 || !confirm(fullDate(s2.dateISO) + " 회차를 삭제할까요?")) return;
      state.sessions = (state.sessions || []).filter(function(x){ return x.id !== s2.id; });
      schedulePersist(); renderSched();
    }
  });
  document.getElementById("sched-list").addEventListener("input", function(e){
    var pl = e.target.closest("[data-plan]");
    if (pl && isAdmin()){
      var ps = sessionById(pl.dataset.plan);
      if (ps){ ps.plan = pl.value; schedulePersist(); }
      return;
    }
    var inp = e.target.closest("[data-con]");
    if (!inp || !isAdmin()) return;
    var s = sessionById(inp.dataset.con);
    if (!s) return;
    s.concept = inp.value;
    schedulePersist();
  });

  document.getElementById("btn-att-refresh").addEventListener("click", function(){

    pullAll(false, false);

  document.getElementById("btn-add-session").addEventListener("click", function(){
    if (!isAdmin()) return;
    var ss = sessionList(), last = ss[ss.length-1], def = "";
    if (last){
      var p = ymd(last.dateISO), d = new Date(p[0], p[1]-1, p[2] + 7);
      def = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
    }
    var v = prompt("회차 날짜 (YYYY-MM-DD)", def);
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v.trim())) return;
    if (!state.sessions) state.sessions = [];
    state.sessions.push({
      id: newId("t"), dateISO: v.trim(),
      start: last ? last.start : "19:00", end: last ? last.end : "21:00",
      concept: "", plan: "", off: false
    });
    schedulePersist(); renderSched();
  });

  setInterval(function(){
    if (document.hidden || !serverUrl()) return;

  /* ── 큐시트 ─────────────────────── */
  var cueQuery = "", cueMine = false;
  var TUTTI = /다같이|합창|여자/;
  function cueHasName(c, name){
    return [c.part, c.memo, c.setting, c.mic].some(function(t){ return (t || "").indexOf(name) >= 0; });
  }
  function cueMark(text){
    var html = esc(text || "");
    if (cueQuery){
      var q = esc(cueQuery).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      html = html.replace(new RegExp(q, "gi"), function(m){ return "<mark>" + m + "</mark>"; });
    }
    return html.replace(/\n/g, "<br>");
  }
  function renderCues(){
    var sg = curSong(), me = peopleList().find(function(p){ return p.id === meId; });
    var all = (state.cues || []).filter(function(c){ return sg && c.songId === sg.id; });
    var q = cueQuery.toLowerCase();
    var rows = all.filter(function(c){
      if (cueMine && me && !cueHasName(c, me.name) && !TUTTI.test(c.part)) return false;
      return !q || [c.part, c.text, c.memo, c.setting, c.mic].join("\n").toLowerCase().indexOf(q) >= 0;
    });
    var mineBtn = document.getElementById("cue-mine");
    mineBtn.setAttribute("aria-pressed", String(cueMine && !!me));
    mineBtn.textContent = cueMine && me ? me.name + " 큐만" : "내 큐만";
    document.getElementById("cue-count").textContent = rows.length + " / " + all.length + "행";
    document.getElementById("cue-mic").textContent = sg && sg.micNote ? "마이크 · " + sg.micNote : "";
    var head = '<div class="ct-row ct-head"><div>파트</div><div>가사·대사·큐</div><div>동작·동선 메모</div><div>마이크 셋팅</div></div>';
    document.getElementById("cuetable").innerHTML = !rows.length
      ? '<p class="pdf-msg">' + (all.length ? "조건에 맞는 큐가 없어요." : "큐시트가 없어요.") + "</p>"
      : head + rows.map(function(c, i){
        var sec = c.section && (!i || rows[i-1].section !== c.section) ? '<div class="ct-sec">' + esc(c.section) + "</div>" : "";
        return sec + '<div class="ct-row">' +
          '<div class="ct-part"><b>' + cueMark(c.part.replace(/^\[|\]$/g, "")) + "</b>" +
            (c.type ? '<span class="ct-type">' + esc(c.type) + "</span>" : "") +
            (c.mic ? '<span class="ct-micb">' + cueMark(c.mic) + "</span>" : "") + "</div>" +
          '<div class="ct-text">' + cueMark(c.text) + "</div>" +
          '<div class="ct-memo">' + cueMark(c.memo) + "</div>" +
          '<div class="ct-set">' + cueMark(c.setting) + "</div></div>";
      }).join("");
  }
  document.getElementById("cue-q").addEventListener("input", function(e){ cueQuery = e.target.value.trim(); renderCues(); });
  document.getElementById("cue-mine").addEventListener("click", function(){
    if (!peopleList().find(function(p){ return p.id === meId; })){
      setTab("sched"); askMe(); return;
    }
    cueMine = !cueMine; renderCues();
  });

  /* ── 설정: 공연 정보 · 곡 · 멤버 · 명단 ──────── */

        '<div class="people">' + peopleList().map(function(p){
          return '<span class="pp">' + esc(p.name) + '<button data-ppdel="' + esc(p.id) + '" aria-label="' + esc(p.name) + ' 삭제">✕</button></span>';
        }).join("") + '</div>' +
        '<textarea id="people-in" placeholder="이름을 줄바꿈이나 쉼표로 구분해 붙여넣기"></textarea>' +
        '<div class="setup-actions"><button class="btn" id="btn-add-people">명단에 추가</button></div></div>' +
      '<div class="setup-card"><h2>데이터</h2><p class="help">내보낸 파일은 저장소의 data.json 자리에 넣거나, 서버 연결 후 불러오기로 올릴 수 있어요.</p>' +
        '<div class="setup-actions"><button class="btn" id="btn-export">data.json 내보내기</button>' +
        '<button class="btn" id="btn-import">불러오기</button>' +
        '<input type="file" id="import-file" accept="application/json,.json" hidden></div></div>';
  }
  function setupChanged(){ schedulePersist(); renderAll(); }
  var setupEl = document.getElementById("setup");
  setupEl.addEventListener("input", function(e){
    var t = e.target, d = t.dataset;
    if (!isAdmin()) return;
    if (d.show){
      state.show[d.show] = t.value; renderShowHead();
    }else if (d.mb){
      var m = state.members.find(function(x){ return x.id === d.id; }); if (!m) return;
      m[d.mb] = t.value; renderStage(false); renderLegend();
    }else return;
    schedulePersist();
  });
  setupEl.addEventListener("click", function(e){
    if (!isAdmin()) return;
    var b;
    if (e.target.closest("#btn-add-member")){
      state.members.push({id: newId("m"), no: state.members.reduce(function(a, x){ return Math.max(a, x.no || 0); }, 0) + 1, name: "", role: "", color: MEMBER_COLORS[state.members.length % MEMBER_COLORS.length]});
      setupChanged();
      var inputs = setupEl.querySelectorAll('[data-mb="name"]');
      if (inputs.length) inputs[inputs.length-1].focus();
    }else if ((b = e.target.closest("[data-mbdel]"))){
      var mid = b.dataset.mbdel, mb = state.members.find(function(x){ return x.id === mid; });
      if (!mb || !confirm((mb.name || "이 멤버") + "를 삭제할까요? 모든 대형에서 빠집니다.")) return;
      state.members = state.members.filter(function(x){ return x.id !== mid; });
      state.scenes.forEach(function(c){ delete c.positions[mid]; });
      setupChanged();
    }else if ((b = e.target.closest("[data-ppdel]"))){
      state.people = state.people.filter(function(x){ return x.id !== b.dataset.ppdel; });
      setupChanged();
    }else if (e.target.closest("#btn-add-people")){
      var names = document.getElementById("people-in").value.split(/[\n,]+/).map(function(x){ return x.trim(); }).filter(Boolean);
      names.forEach(function(nm){
        if (!state.people.find(function(x){ return x.name === nm; })) state.people.push({id: newId("p"), name: nm});
      });
      setupChanged();
    }else if (e.target.closest("#btn-export")){
      var url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type: "application/json"}));
      var a = document.createElement("a");
      a.href = url; a.download = "data.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }else if (e.target.closest("#btn-import")){
      document.getElementById("import-file").click();
    }
  });
  setupEl.addEventListener("change", function(e){
    if (e.target.id !== "import-file" || !e.target.files[0]) return;
    e.target.files[0].text().then(function(text){
      var j = JSON.parse(text);
      if (!j || !Array.isArray(j.members) || !Array.isArray(j.songs) || !Array.isArray(j.scenes)) throw 0;
      if (!confirm("지금 내용을 이 파일로 덮어쓸까요? (곡 " + j.songs.length + "개, 멤버 " + j.members.length + "명)")) return;
      state = migrate(j);
      applyRepoFixed();
      setupChanged();
    }).catch(function(){ alert("data.json 형식이 아니에요."); });
  });

  function renderAll(){
    if (!songById(curSongId)) curSongId = state.songs.length ? state.songs[0].id : null;
    if (!songScenes().find(function(c){ return c.id===curSceneId; })){
      var l = songScenes(); curSceneId = l.length ? l[0].id : null;
    }
    applySongTheme(); renderSongSwitcher();
    renderCueList(); renderStage(false); renderLegend(); renderCueMeta();
    renderLyrics(); renderScoreDocs(); renderFiles();
    renderMeSelect(); renderSched(); renderShowHead(); renderSetup(); renderCues(); maybePull();
    loadedDocId = null;
    if (curTab === "scores") loadCurDoc();
  }
  applyMode();
  renderAll();
  setTab(!state.songs.length && isAdmin() && !parseHash().tab ? "setup" : curTab);
})();
</script>
</body>
</html>
